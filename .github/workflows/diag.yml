name: diag
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt && python -m playwright install --with-deps chromium > /dev/null
      - name: Diagnose
        env:
          TARGET: ${{ secrets.TARGET }}
        run: |
          mkdir -p shots
          python - <<'PY' > shots/result.txt 2>&1 || true
          import os, time
          from playwright.sync_api import sync_playwright
          u, cat, fac, room = [s.strip() for s in os.environ["TARGET"].split("|")]
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page(locale="ja-JP", viewport={"width":1280,"height":900})
              def shot(n): pg.screenshot(path=f"shots/{n}.png", full_page=True)
              t=time.time()
              try:
                  pg.goto(u, wait_until="commit", timeout=40000); print(f"1 commit ok {time.time()-t:.1f}s")
                  pg.wait_for_load_state("domcontentloaded", timeout=40000); print(f"1 domcontentloaded ok {time.time()-t:.1f}s")
              except Exception as e: print("1 goto", type(e).__name__, f"{time.time()-t:.1f}s")
              time.sleep(5); shot("1_top"); print("1 url", pg.url)
              try:
                  pg.wait_for_load_state("load", timeout=30000); print(f"1 load ok {time.time()-t:.1f}s")
              except Exception as e: print("1 load", type(e).__name__)
              try:
                  btn = pg.locator(f"input[type=button][value='{cat}'], button:text-is('{cat}')").first
                  btn.click(timeout=20000); time.sleep(4); shot("2_category"); print("2 url", pg.url)
                  pg.locator("label", has_text=fac).first.click(timeout=20000)
                  pg.evaluate("__doPostBack('next','')"); time.sleep(5); shot("3_calendar"); print("3 url", pg.url)
              except Exception as e:
                  print("step error", type(e).__name__); shot("x_error")
              b.close()
          PY
          cat shots/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
          retention-days: 1
